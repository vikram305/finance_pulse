name: finance_pulse
description: "Pulse — Offline-first financial resilience and simulation utility."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State management & DI
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0

  # Functional programming
  fpdart: ^1.1.0
  equatable: ^2.0.5

  # Navigation (ADR-012)
  go_router: ^14.6.2

  # Local database (ADR-018: Drift with SQLCipher & WASM)
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlcipher_flutter_libs: ^0.7.0+eol
  sqlite3: ^2.5.7
  path_provider: ^2.1.4

  # Security & encryption (ADR-004, ADR-016)
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  bloc_test: ^10.0.0
  mockito: ^5.4.4

  # Code generation — drift_dev for Drift tables and DAOs (ADR-018)
  drift_dev: ^2.24.2
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
